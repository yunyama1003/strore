spring.application.name=strore
server.port=8081
# Home network only. Do not expose this login-free app to the internet.
server.address=0.0.0.0
spring.datasource.url=jdbc:h2:file:./data/strore;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.accept-float-as-int=false
